name: testfoss-demo

on:
  push:
    branches: [testfoss-demo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testfoss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Build and run full Jest suite
        run: ./testfoss/run.sh package
      - name: Install Testfoss browser tools
        run: |
          cd testfoss
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run 1CBS viewer and trajectory through lmwebtest
        run: ./testfoss/run.sh browser
